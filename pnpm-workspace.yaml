# Pastas que contêm pacotes do workspace
packages:
  - "apps/*"
  - "packages/*"
  - "packages/config/*"

# Executa os scripts do package.json com um shell compatível com bash em qualquer sistema.
# Sem isso, no Windows o pnpm usa o cmd.exe e comandos como "rm -rf" falham.
shellEmulator: true

# Catálogo: versão única de cada dependência compartilhada.
# Os pacotes declaram "catalog:" no lugar da versão e o pnpm resolve daqui.
# Atualizar uma lib = alterar uma linha neste arquivo.
catalog:
  # Linguagem e UI
  typescript: 7.0.2
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0

  # Build e estilo
  vite: 8.3.8
  "@vitejs/plugin-react": 6.3.0
  tailwindcss: 4.3.5
  "@tailwindcss/vite": 4.3.5

  # Monorepo
  turbo: 2.11.11

  # Qualidade
  "@biomejs/biome": 2.6.7
  husky: 9.1.7
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4

  # Testes
  vitest: 5.1.0
  "@vitest/coverage-v8": 5.1.0
  "@vitest/browser-playwright": 5.1.0
  jsdom: 31.0.1
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.10
  "@testing-library/jest-dom": 7.0.1
  axe-core: 4.14.0

  # Tipos
  "@types/node": 26.6.6
  "@commitlint/types": 21.2.3

  # Design tokens
  style-dictionary: 5.8.0
  colorjs.io: 0.7.1

  # Componentes
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  "@tailwindcss/cli": 4.3.5

  # Storybook
  storybook: 10.6.7
  "@storybook/react-vite": 10.6.7
  "@storybook/addon-docs": 10.6.7
  "@storybook/addon-a11y": 10.6.7
  "@storybook/addon-themes": 10.6.7

allowBuilds:
  "@parcel/watcher": false
  esbuild: false

minimumReleaseAgeExclude:
  - jsdom@31.0.1
